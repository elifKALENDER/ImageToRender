# Settings that differ from config.yaml for this building only.
detect:
  # The supports of the blind arcades are engaged colonnettes (attached to the wall), as on s01, and the
  # detector labels such supports "column"; every "column" detection is treated as a pilaster. Taken over
  # from s01 (RND-001) because the element type is the same; not measured on this photograph.
  class_merge:
    column: pilaster
evidence:
  tier_b:
    # Bay donor (B3): the breach reaches from the ground to just under the cornice, about one arch height
    # (180 px) above the arch boxes of the draft inventory (arch top y = 1440, cornice about y = 1265).
    # Read off the photograph by the assistant, not measured; set after the first run of 2026-11-15.
    bay_top_extension: 0.95
    # The breach reaches 40 to 50 px beyond the lost support (x = 1135) into the broken edge of the next
    # bay's wall (to about x = 1185); with the default 0.15 (35 px) a slit of the mask stays open there.
    # Read off the photograph by the assistant, 2026-11-16.
    bay_side_margin: 0.22
