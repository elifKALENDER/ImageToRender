# ImageToRender — the single settings file.
#
# Every threshold used by the pipeline lives here; modules must not hard-code them.
# Values marked "initial guess, calibrate in T20" are not validated yet and must not be
# reported as tuned before the synthetic damage test (docs/ARCHITECTURE.md §7) has run.
# A building can override any value in data/structures/<id>/structure.yaml (same layout, only the
# keys that differ). Each run writes the merged, effective settings into its run folder as
# config.yaml, so results stay reproducible.

paths:
  data_root: data/structures       # one folder per building: image.png, damage_mask.png, SOURCE.md
  output_root: outputs             # runs go to outputs/<structure_id>/<timestamp>/
  image_file: image.png
  damage_mask_file: damage_mask.png

# Architectural element classes (docs/ARCHITECTURE.md §1).
# `prompts` are the OWL-ViT text queries. Short, common English words work better than long
# technical phrases. Prompts for arch, pilaster, column, window, door, cornice and base are taken
# from the archived Stage 1; the others are new and untested.
classes:
  window:      {prompts: [window, window opening]}
  door:        {prompts: [door, doorway]}
  arch:        {prompts: [arch, stone arch, arched opening, arcade]}
  pilaster:    {prompts: [pilaster, wall pillar, rectangular column]}
  column:      {prompts: [column, stone column]}
  cornice:     {prompts: [cornice, wall molding, moulding]}
  eave:        {prompts: [eave, roof edge]}
  jamb:        {prompts: [door frame, window frame]}
  console:     {prompts: [corbel, bracket, console]}
  parapet:     {prompts: [parapet]}
  roof:        {prompts: [roof, dome, conical roof]}
  base:        {prompts: [column base, plinth]}

detect:
  owlvit_model_id: google/owlvit-base-patch32
  sam_model_id: facebook/sam-vit-base
  use_fp16_if_cuda: true
  # Multi-scale views (values from the archived Stage 1).
  use_full_image_view: true
  use_damage_context_view: true
  damage_context_expand: 2.40
  damage_context_min_fraction: 0.48   # minimum side of that view, as a share of the short image side
  tile_fraction_of_short_side: 0.68
  tile_overlap: 0.38
  max_detection_views: 10
  # Per prompt: keep boxes with score >= max(absolute_score_floor, best_score * relative_score_ratio).
  absolute_score_floor: 0.008
  relative_score_ratio: 0.58
  # If no box passes for a prompt, keep its single best box as "fallback" when at least this score.
  fallback_score_floor: 0.0035
  max_candidates_per_prompt_per_view: 3
  max_candidates_per_class_before_nms: 24
  nms_iou_threshold: 0.42
  max_detections_per_class: 10
  max_total_detections: 48
  min_box_area_ratio: 0.0010        # box area / view area
  max_box_area_ratio: 0.82
  min_mask_area_ratio: 0.0001       # SAM mask area / image area; smaller elements are dropped
  # Boxes covering more than this share of the image are dropped (RND-001: every such box on s01
  # spanned the whole building and was wrong). A class can override it: classes.<name>.max_area_ratio.
  max_element_area_ratio: 0.15      # chosen on s01 only; re-check on every new structure
  # Classes the detector cannot tell apart are merged before NMS, e.g. {column: pilaster}.
  # Empty here; set per building in data/structures/<id>/structure.yaml and give the reason there.
  class_merge: {}
  sam_batch_size: 6

review:
  # Elements with a detector score below this are shown to the expert for confirmation.
  # On s01 every detector score is below 0.06 (RND-001), so 0.15 means every element is reviewed.
  confidence_threshold: 0.15        # initial guess, calibrate in T20
  open_overlay: true                # open review_overlay.png in the default image viewer

editor:
  # tools/editor_adapter.py: editor classes that are not in `classes` above, mapped to one that is.
  # Only needed for inventories saved by the old editor (e.g. its "opening"). Set per building in
  # data/structures/<id>/structure.yaml and give the reason there.
  class_map: {}

damage:
  # An element is "intact" when the share of its mask inside the damage mask is below this.
  intact_max_overlap: 0.05          # initial guess, calibrate in T20 (§5.1)
  # A damage mask covering less than this share of the image is treated as empty (error).
  min_mask_fraction: 0.001
  # Connected damage regions smaller than this many pixels are ignored.
  min_region_px: 64

# tools/mask_editor.py: drawing window.
mask_editor:
  brush_px: 34
  max_width: 1200
  max_height: 780

# tools/mask_editor.py --propose: automatic dark-region proposal. Values copied unchanged from
# archive/inpaint/inpaint_v3.py; never calibrated. The proposal is a starting point to correct by hand,
# not a damage mask (real openings are dark too).
mask_proposal:
  dark_percentile: 20.0             # pixels at or below this grey percentile count as dark ...
  max_gray: 100                     # ... but never above this grey value
  local_contrast: 16                # dark pixel must be this much darker than its blurred surroundings
  min_area_ratio: 0.0007            # components smaller than this share of the image are dropped
  max_component_ratio: 0.32         # components larger than this share are dropped
  close_px: 5
  expand_px: 5
  drop_border_components: true

evidence:
  dino_model_id: facebook/dinov2-small
  # Tier A: best donor similarity (DINOv2 cosine) must reach this.
  min_similarity: 0.60              # initial guess, calibrate in T20 (§5.2)
  # Donor and target width and height ratios must lie within 1 +/- size_tolerance.
  size_tolerance: 0.35              # initial guess, calibrate in T20
  alternatives_kept: 2
  try_flipped_donor: true
  # Tier A needs a visible fragment (§5.2). Below this share of visible pixels in the target box the
  # crops are mostly fill colour and the similarity is meaningless (s01: 0.95 at 8 % visible).
  min_visible_fraction: 0.25        # initial guess, calibrate in T20
  # Embedding: each element box is resized to crop_px x crop_px (aspect distortion is the same for
  # donor and target, whose sizes already agree within size_tolerance) and the patch tokens are
  # mean-pooled ("mean_patch") or the CLS token is used ("cls").
  crop_px: 224
  pooling: mean_patch
  # Hide the target's damaged part on the donor crop too, so both are compared on the same visible part.
  mask_donor_like_target: true
  use_fp16_if_cuda: true
  batch_size: 16
  tier_b:
    rows_enabled: true              # B1: gap in a row of same-class elements
    row_tolerance: 0.15             # initial guess, calibrate in T20: centre/height agreement and spacing multiple
    symmetry_enabled: true          # B2: mirror across the facade symmetry axis
    symmetry_min_agreement: 0.60    # initial guess, calibrate in T20; below this B2 is switched off
    # B1 needs at least this many observed elements in a row to estimate its spacing.
    min_row_size: 3
    # An implied slot must lie at least this much inside the damage mask ...
    slot_min_damage: 0.50           # initial guess, calibrate in T20
    # ... and no same-class element may cover more than this share of it.
    slot_free_max_overlap: 0.30     # initial guess, calibrate in T20
    # B2: a mirrored element "matches" when its IoU with a same-class element reaches this.
    mirror_match_iou: 0.30          # initial guess, calibrate in T20
    # B2: an axis is scored only when at least this many elements can be checked against it.
    symmetry_min_elements: 4
    # B2: vertical axis x in image pixels, given by the author; null = estimate from the elements.
    # Set it per building in data/structures/<id>/structure.yaml.
    symmetry_axis_x: null

restoration:
  include_tier_b: false             # Venice Charter: stop where conjecture begins (§5.3, D4)
  tone_shift: 0.08                  # lightness change applied to completed regions, 0..1
  outline_px: 1
  outline_color: [255, 255, 255]
  hatch_spacing_px: 8
  hatch_color: [220, 60, 60]
  label: "AI proposal, not a restoration decision"

first_construction:
  generative: false                 # tier C fill (T21); stays off unless it proves usable
  strength: 0.55
  steps: 30
  guidance_scale: 6.5
  context_min_px: 512
  seed: 42
  prompt: >-
    historic stone masonry building, original construction state, same architectural language,
    same stone, same light, photorealistic photograph
  negative_prompt: >-
    redesigned building, altered architecture, extra windows, duplicate arches, modern facade,
    concrete, glass, fantasy architecture, changed viewpoint, warped columns, melted masonry,
    low quality, blurry, cartoon, painting, text, watermark

models:
  inpaint_base: SG161222/Realistic_Vision_V6.0_B1_noVAE
  vae: stabilityai/sd-vae-ft-mse
  depth_controlnet: lllyasviel/control_v11f1p_sd15_depth
  lineart_controlnet: lllyasviel/control_v11p_sd15_lineart
  depth_estimator: Intel/dpt-hybrid-midas
  annotator_repo: lllyasviel/Annotators
